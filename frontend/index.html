<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLX Chat</title>

  <!-- KaTeX for math rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"
    onload="window._katexReady = true"></script>

  <!-- highlight.js for code -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

  <!-- marked.js for markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<!-- ── Sidebar ──────────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-header">
    <div class="app-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <span>MLX Chat</span>
    </div>
    <button id="btn-new-chat" class="btn-icon" title="New chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <nav class="sidebar-nav">
    <button class="nav-btn active" data-view="chat">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span>Chat</span>
    </button>
    <button class="nav-btn" data-view="models">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <span>Models</span>
    </button>
  </nav>

  <div id="conversation-list" class="conversation-list"></div>
</aside>

<!-- ── Main content ──────────────────────────────── -->
<main id="main">

  <!-- ── Chat view ── -->
  <div id="view-chat" class="view active">
    <header class="chat-header">
      <div class="model-selector-wrap">
        <label>Model</label>
        <div class="model-select-container">
          <select id="model-select">
            <option value="">— select a model —</option>
          </select>
          <button id="btn-load-model" class="btn-primary btn-sm">Load</button>
        </div>
        <span id="model-status" class="model-status"></span>
      </div>
      <button id="btn-settings" class="btn-icon" title="Generation settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33
            1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06
            a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09
            A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06
            A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51
            a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9
            a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>

    <div id="messages" class="messages">
      <div id="welcome" class="welcome">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h2>MLX Chat</h2>
        <p>Fast local AI on Apple Silicon.<br>Select and load a model to begin.</p>
      </div>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="user-input" placeholder="Load a model to start chatting…" rows="1"></textarea>
        <button id="btn-send" class="btn-send" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <p class="input-hint">MLX Chat runs models locally on your Mac. Responses may vary.</p>
    </div>
  </div>

  <!-- ── Models view ── -->
  <div id="view-models" class="view">
    <div class="models-header">
      <h2>Model Management</h2>
      <div id="memory-info" class="memory-info"></div>
    </div>

    <div class="models-section">
      <h3>Local Models</h3>
      <div id="local-models-list" class="models-grid"></div>
    </div>

    <div class="models-section">
      <h3>Browse mlx-community</h3>
      <div class="search-bar">
        <div class="search-bar-input-wrap">
          <input id="model-search" type="text" placeholder="Search mlx-community models…" autocomplete="off" />
          <!-- autocomplete dropdown injected here by JS -->
        </div>
        <button id="btn-search" class="btn-primary">Search</button>
      </div>
      <div id="search-results" class="models-grid"></div>
    </div>
  </div>

</main>

<!-- ── Settings panel ─────────────────────────────── -->
<div id="settings-overlay" class="overlay hidden"></div>
<aside id="settings-panel" class="settings-panel hidden">
  <div class="settings-header">
    <h3>Generation Settings</h3>
    <button id="btn-close-settings" class="btn-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="settings-body">
    <label>System Prompt
      <textarea id="set-system-prompt" rows="4" placeholder="You are a helpful assistant."></textarea>
    </label>

    <label>Temperature <span id="val-temperature" class="val-badge">0.7</span>
      <input type="range" id="set-temperature" min="0" max="2" step="0.05" value="0.7" />
    </label>

    <label>Top-P <span id="val-top-p" class="val-badge">0.9</span>
      <input type="range" id="set-top-p" min="0" max="1" step="0.05" value="0.9" />
    </label>

    <label>Max Tokens
      <input type="number" id="set-max-tokens" min="64" max="32768" step="64" value="2048" />
    </label>

    <label>Repetition Penalty <span id="val-rep-penalty" class="val-badge">1.1</span>
      <input type="range" id="set-rep-penalty" min="1" max="2" step="0.05" value="1.1" />
    </label>

    <label>Repetition Context Size
      <input type="number" id="set-rep-context" min="5" max="100" step="5" value="20" />
    </label>

    <div class="settings-divider"></div>

    <label class="checkbox-label">
      <input type="checkbox" id="set-turboquant" />
      <span>Enable TurboQuant (KV-cache compression)</span>
    </label>

    <div id="turboquant-options" class="hidden">
      <label>KV Bits <span id="val-kv-bits" class="val-badge">4</span>
        <input type="range" id="set-kv-bits" min="2" max="8" step="0.5" value="4" />
        <small>Lower = more compression, less accuracy. Values like 3.5 auto-enable TurboQuant splitting.</small>
      </label>
    </div>

    <div class="settings-actions">
      <button id="btn-save-settings" class="btn-primary">Save Settings</button>
      <button id="btn-reset-settings" class="btn-ghost">Reset to Defaults</button>
    </div>
  </div>
</aside>

<!-- ── Toast notifications ───────────────────────── -->
<div id="toast-container"></div>

<script src="/static/js/main.js" type="module"></script>
</body>
</html>
